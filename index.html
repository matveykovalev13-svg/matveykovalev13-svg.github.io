<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой тестовый сайт</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: rgba(255,255,255,0.1);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { font-size: 42px; margin-bottom: 10px; }
        p { font-size: 18px; opacity: 0.8; }
        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: #ff6b6b;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #ff4757; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Привет, мир!</h1>
        <p>Это мой первый тестовый сайт на GitHub Pages</p>
        <button onclick="alert('Кнопка работает! 🎉')">Нажми меня</button>
    </div>
</body>
</html>
