<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мессенджер</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ЭКРАН АВТОРИЗАЦИИ -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h1 id="authTitle">Вход</h1>
      <form id="authForm">
        <input type="text" id="username" placeholder="Логин (только для регистрации)" class="hidden" />
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Пароль (мин. 6)" required minlength="6" />
        <button type="submit" id="authSubmit">Войти</button>
      </form>
      <p class="auth-switch">
        <span id="authHint">Нет аккаунта?</span>
        <a href="#" id="authToggle">Зарегистрироваться</a>
      </p>
      <p id="authError" class="error"></p>
    </div>
  </div>

  <!-- ЭКРАН ЧАТА -->
  <div id="chatScreen" class="app hidden">
    <aside class="sidebar">
      <div class="me" id="openProfileBtn" style="cursor: pointer;" title="Настройки профиля">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div id="myAvatar" style="width: 36px; height: 36px; border-radius: 50%; background: #5288c1; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; font-size: 14px;">?</div>
          <span id="myName">...</span>
        </div>
        <button id="logoutBtn" title="Выйти" style="pointer-events: auto;">⏻</button>
      </div>
      <div class="sidebar-header">
        <input type="text" id="userSearch" placeholder="Поиск по @логину..." />
      </div>
      <ul class="chat-list" id="chatList"></ul>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <div class="chat-avatar" id="chatAvatar">💬</div>
        <div class="chat-info">
          <h2 id="chatTitle">Выбери собеседника</h2>
          <span id="chatStatus">—</span>
        </div>
      </header>
      <div class="messages" id="messages">
        <div class="empty-hint">Найди друга по логину слева</div>
      </div>
      
      <form class="composer" id="composer">
        <input type="text" id="messageInput" placeholder="Сообщение..." autocomplete="off" />
        <button type="submit">➤</button>
      </form>
    </main>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ПРОФИЛЯ -->
  <div id="profileModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Мой профиль</h2>
        <button id="closeProfileModal" class="close-btn">✕</button>
      </div>
      
      <div class="profile-banner-container">
        <div id="profileBanner" class="profile-banner"></div>
        <button id="uploadBannerBtn" class="small-btn">Изменить баннер</button>
        <input type="file" id="bannerUpload" accept="image/*" style="display: none;" />
      </div>

      <div class="profile-avatar-container">
        <div id="profileAvatarLarge" class="profile-avatar-large">?</div>
        <button id="uploadAvatarBtn" class="small-btn">Изменить аватарку</button>
        <input type="file" id="avatarUpload" accept="image/*" style="display: none;" />
      </div>

      <div class="profile-info">
        <label>Username</label>
        <input type="text" id="settingsUsername" placeholder="@username" />
        
        <label>Номер телефона / Текст</label>
        <input type="text" id="settingsPhone" placeholder="+7 999 000-00-00" />

        <div id="adminPanel" class="hidden">
          <hr style="margin: 15px 0; border-color: #2b3a4a;">
          <h3 style="color: #ffd700; margin-bottom: 10px;">👑 Админ-панель</h3>
          <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
            <input type="checkbox" id="settingsIsCreator" style="width: auto;" />
            Показывать статус "Креатор" (🔥)
          </label>
        </div>

        <button id="saveProfileBtn" class="primary-btn" style="margin-top: 20px;">Сохранить изменения</button>
      </div>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
